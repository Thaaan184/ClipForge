services:
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    ports:
      - "8765:8765"
    environment:
      - PORT=8765
      - HOST=0.0.0.0
      - NODE_ENV=production
    volumes:
      - clipforge_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8765/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - CF_DATA_DIR=/app/data
      - CF_DB_PATH=/app/data/clipforge.db
      - CF_BIND=0.0.0.0
      - CF_PORT=8000
      - CF_ALLOWED_HOSTS=youtube.com,www.youtube.com,m.youtube.com,youtu.be
      - CF_LLM_BASE_URL=${CF_LLM_BASE_URL:-${LLM_API_BASE:-}}
      - CF_LLM_API_KEY=${CF_LLM_API_KEY:-${LLM_API_KEY:-}}
      - CF_LLM_MODEL=${CF_LLM_MODEL:-gemini-2.5-flash}
      - REMOTION_WORKER_URL=http://worker:8765
    volumes:
      - clipforge_data:/app/data
    depends_on:
      worker:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  clipforge_data:
